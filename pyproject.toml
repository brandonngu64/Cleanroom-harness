[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanroom-harness"
version = "0.1.0"
description = "A small, measurable execution harness for a single coding agent"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cleanroom = "harness.cli:main"

[project.optional-dependencies]
claude = ["anthropic>=2.8.0,<3"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
